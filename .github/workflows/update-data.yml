name: Update fixtures data

on:
  schedule:
    # Daily refresh at 04:30 UTC (06:30 Cairo winter time). Keeps the weekly
    # board fresh and picks up lineups/scores as ESPN publishes them.
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch latest fixtures
        run: python3 fetch_data.py
      - name: Commit updated data
        run: |
          git config user.name "joker-sports-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add matches.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: refresh fixtures $(date -u +%Y-%m-%d)"
            git push
          fi
